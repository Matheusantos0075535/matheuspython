<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SobrioApp{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

{% if session.user_id %}
<nav class="navbar">
  <a class="nav-brand" href="{{ url_for('dashboard') }}">🌿 SobrioApp</a>
  <div class="nav-links">
    <a href="{{ url_for('dashboard') }}"
       class="nav-link{% if request.endpoint == 'dashboard' %} active{% endif %}">🏠 Início</a>
    <a href="{{ url_for('history') }}"
       class="nav-link{% if request.endpoint == 'history' %} active{% endif %}">📅 Histórico</a>
    <a href="{{ url_for('friends') }}"
       class="nav-link{% if request.endpoint == 'friends' %} active{% endif %}">👥 Amigos</a>
    <a href="{{ url_for('profile') }}"
       class="nav-link{% if request.endpoint == 'profile' %} active{% endif %}">🏆 Perfil</a>
    <a href="{{ url_for('logout') }}" class="nav-link logout">Sair</a>
  </div>
</nav>
{% endif %}

<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
